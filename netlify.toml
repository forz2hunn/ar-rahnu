[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are set as Netlify environment variables (not hardcoded here).
  # The Supabase URL is public by design and Vite inlines it into the client bundle,
  # so exclude it from secrets scanning of the build output.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL"

# Always fetch the latest service worker and manifest
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
