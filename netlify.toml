[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public Supabase project URL (not a secret). The anon/publishable key is set as a Netlify environment variable.
  VITE_SUPABASE_URL = "https://zyikvjbnroicbeezpxvx.supabase.co"

# Always fetch the latest service worker and manifest
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
